[project]
name = "mass"
version = "0.1.0"
description = "MASS: recursive self-improvement through multi-agent self-supervision (research pipeline)"
readme = "README.md"
requires-python = ">=3.12"
# Client, judging, and trace-rendering dependencies shared by every stage.
# Keep pins exact; docs/reproduction.md records the original research-environment pins.
dependencies = [
    "openai==3.29.0",
    "anthropic==1.13.0",
    "pydantic==2.14.1",
    "aiohttp==3.14.5",
    "httpx2==2.13.1",
    "tiktoken==0.14.0",
    "huggingface-hub==2.2.0",
]

[dependency-groups]
dev = ["ruff>=0.17,<0.18"]
# LoRA SFT, adapter merge, and FP8 export (.venv-train).
train = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "peft==0.21.2",
    "safetensors==0.8.0",
    "flash-linear-attention==0.5.2",
    # Triton for the fla kernels on Windows (torch bundles upstream Triton only on Linux).
    "triton-windows==3.8.0.post29; sys_platform == 'win32'",
]
# vLLM inference server (.venv-serve). vLLM pins its own torch (2.13.0), older than train's.
serve = ["vllm==0.30.0", "transformers==5.19.0"]
# Public-benchmark adapters (.venv-bench). Harbor is installed separately from
# the pinned checkout that benchmarks/fetch_sources.py places in benchmarks/vendor/.
bench = ["datasets==5.1.0", "docker==7.2.0", "tqdm>=4.66"]

[tool.uv]
# Commands run from the repository root against the checkout; there is no
# installable distribution, so uv manages only the environment.
package = false
default-groups = ["dev"]
conflicts = [[{ group = "train" }, { group = "serve" }]]

# PyPI ships CPU-only torch wheels for Windows; take the CUDA build there.
# Linux keeps PyPI torch, which bundles CUDA.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[tool.ruff]
target-version = "py312"
line-length = 160
extend-exclude = [
    "benchmarks/vendor",
    "benchmarks/work",
    "runs",
    "models",
    ".omo",
]

[tool.ruff.lint]
# Correctness-focused rules only: syntax errors, pyflakes, likely bugs, and
# file I/O that silently depends on the platform's locale encoding.
preview = true
explicit-preview-rules = true
select = ["E9", "F", "B", "PLW1514"]
