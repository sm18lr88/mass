name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked core dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Preview both cycles
        run: |
          uv run --locked python -m mass plan --config configs/paper.json
          uv run --locked python -m mass plan --config configs/cycle2.json
      - name: Check reviewed source files
        run: uv run --locked python tools/check_source.py
